<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#000000"/>
  
  <!-- Outer white circle border -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="white" stroke-width="5"/>
  
  <!-- Directional marks - Top -->
  <line x1="100" y1="8" x2="100" y2="28" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Directional marks - Right -->
  <line x1="192" y1="100" x2="172" y2="100" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Directional marks - Bottom -->
  <line x1="100" y1="192" x2="100" y2="172" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Directional marks - Left -->
  <line x1="8" y1="100" x2="28" y2="100" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Outer orange arcs (top-right) -->
  <path d="M 145 50 A 65 65 0 0 1 160 65" fill="none" stroke="#FF6600" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Outer orange arcs (bottom-right) -->
  <path d="M 160 135 A 65 65 0 0 1 145 150" fill="none" stroke="#FF6600" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Outer orange arcs (bottom-left) -->
  <path d="M 55 150 A 65 65 0 0 1 40 135" fill="none" stroke="#FF6600" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Outer orange arcs (top-left) -->
  <path d="M 40 65 A 65 65 0 0 1 55 50" fill="none" stroke="#FF6600" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Outer dashed black circle -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#000000" stroke-width="8" stroke-dasharray="8,8"/>
  
  <!-- Middle gray circle -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#999999" stroke-width="5"/>
  
  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="42" fill="white"/>
  
  <!-- Inner gray circle (subtle) -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="#DDDDDD" stroke-width="2"/>
  
  <!-- RES text -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#FF6600" text-anchor="middle" dominant-baseline="middle">RES</text>
</svg>
